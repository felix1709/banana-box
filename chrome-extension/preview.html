<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>区域截图预览</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #050b0f;
        color: #e8f6f2;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }
      button {
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        background: #0d1b24;
        color: #e8f6f2;
        padding: 8px 12px;
        cursor: pointer;
      }
      button.primary {
        background: #66f7d3;
        color: #04121a;
        border-color: #66f7d3;
      }
      #status {
        align-self: center;
        color: #b7d0c9;
        font-size: 13px;
      }
      .canvas-wrap {
        flex: 1;
        min-height: 0;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      canvas {
        background: #0a141b;
        border: 1px dashed rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <main class="toolbar">
      <button id="rotate" type="button">旋转 90°</button>
      <button id="crop" type="button">应用裁剪</button>
      <button id="reset" type="button">重置</button>
      <button id="copy" type="button">复制到剪贴板</button>
      <button id="send" class="primary" type="button">传送-分析入库</button>
      <span id="status"></span>
    </main>
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
    <script src="preview.js"></script>
  </body>
</html>
